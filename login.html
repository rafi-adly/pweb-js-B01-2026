<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - MiniShoo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">🛍️</span>
        <span class="brand-name">MiniShoo</span>
      </div>

      <h1>Masuk ke akunmu</h1>
      <p class="login-subtitle">Gunakan username &amp; password akunmu.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="cth: emilys" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <div id="message-container" class="message-container"></div>

        <button type="submit" id="login-button" class="btn-primary">Masuk</button>
      </form>

      <p class="login-hint">Contoh akun dummy untuk uji coba: <strong>emilys</strong> / <strong>emilyspass</strong></p>
    </div>
  </div>

  <script src="js/login.js" defer></script>
</body>
</html>
